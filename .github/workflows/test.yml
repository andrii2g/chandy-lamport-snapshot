name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Generate demonstration
        run: go run ./cmd/snapshot run --scenario scenarios/marker-window.json --out out/demo
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-demo
          path: out/demo/
